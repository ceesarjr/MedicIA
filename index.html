<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPredict AI - Sistema Clínico</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTWVkUHJlZGljdCBBSSIsInNob3J0X25hbWUiOiJNZWRQcmVkaWN0Iiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwZjE3MmEiLCJ0aGVtZV9jb2xvciI6IiMwNmI2ZDQifQ==">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon { box-shadow: 0 0 20px rgba(6,182,212,0.3); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.5s ease-out; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-cyan-500/20 flex items-center justify-center neon">
                    <i data-lucide="brain" class="w-7 h-7 text-cyan-400"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white">MedPredict AI</h1>
                    <p class="text-xs text-cyan-400">Sistema de Predição Clínica Inteligente</p>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-xs text-emerald-400">Sistema Online</span>
            </div>
        </header>

        <!-- Form -->
        <div class="glass rounded-2xl p-6 md:p-8 mb-6" id="formSection">
            <h2 class="text-xl font-bold text-white mb-6">Novo Caso para Análise</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Nome Completo</label>
                    <input type="text" id="pName" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-cyan-500 focus:outline-none transition-colors" placeholder="Ex: João Carlos Silva">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Idade</label>
                    <input type="number" id="pAge" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-cyan-500 focus:outline-none transition-colors" placeholder="Ex: 67">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-slate-400 mb-2">História Clínica Detalhada</label>
                <textarea id="pHistory" rows="6" class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-cyan-500 focus:outline-none transition-colors resize-none" placeholder="Descreva: sintomas, duração, exames, medicamentos, comorbidades, fatores de risco..."></textarea>
            </div>

            <button onclick="analisar()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-3 neon text-lg">
                <i data-lucide="activity" class="w-6 h-6"></i>
                Analisar Caso com IA
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden glass rounded-2xl p-8 text-center">
            <div class="w-16 h-16 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h3 class="text-xl font-semibold text-white mb-2">Analisando dados clínicos...</h3>
            <p class="text-slate-400 mb-4">Comparando com 50.000+ casos similares</p>
            <div class="w-full bg-slate-700 rounded-full h-2 max-w-md mx-auto overflow-hidden">
                <div id="progressBar" class="h-full bg-cyan-500 transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="hidden space-y-6 animate-slide">
            <!-- Header Result -->
            <div class="glass rounded-2xl p-6 border-l-4 border-cyan-500 bg-cyan-500/5">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-2xl font-bold text-white" id="rName">--</h2>
                        <p class="text-slate-400 mt-1" id="rInfo">--</p>
                    </div>
                    <button onclick="novoCaso()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm transition-colors">
                        Novo Caso
                    </button>
                </div>
            </div>

            <!-- Summary Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="glass rounded-xl p-4 border border-slate-700">
                    <p class="text-slate-400 text-sm mb-1">Score de Risco</p>
                    <p class="text-3xl font-bold text-white" id="rScore">--</p>
                </div>
                <div class="glass rounded-xl p-4 border border-slate-700">
                    <p class="text-slate-400 text-sm mb-1">Classificação</p>
                    <p class="text-lg font-semibold" id="rClass">--</p>
                </div>
                <div class="glass rounded-xl p-4 border border-slate-700">
                    <p class="text-slate-400 text-sm mb-1">Condições</p>
                    <p class="text-lg font-semibold text-cyan-400" id="rCond">--</p>
                </div>
            </div>

            <!-- Probabilities -->
            <div class="glass rounded-2xl p-6">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="trending-up" class="text-cyan-400"></i>
                    Probabilidades de Desfecho (6 meses)
                </h3>
                <div id="outcomesList" class="space-y-4"></div>
            </div>

            <!-- Recommendations -->
            <div class="glass rounded-2xl p-6">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i data-lucide="lightbulb" class="text-yellow-400"></i>
                    Recomendações Personalizadas
                </h3>
                <div id="recsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `));
        }

        lucide.createIcons();

        function analisar() {
            const name = document.getElementById('pName').value.trim();
            const age = document.getElementById('pAge').value;
            const history = document.getElementById('pHistory').value.trim();

            if (!name || !age || !history) {
                alert('Preencha todos os campos!');
                return;
            }

            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            
            let prog = 0;
            const bar = document.getElementById('progressBar');
            const int = setInterval(() => {
                prog += 25;
                bar.style.width = prog + '%';
                if (prog >= 100) {
                    clearInterval(int);
                    setTimeout(() => mostrarResultados(name, age, history), 400);
                }
            }, 300);
        }

        function mostrarResultados(name, age, history) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('results').classList.remove('hidden');
            
            document.getElementById('rName').textContent = name;
            document.getElementById('rInfo').textContent = `${age} anos • Análise: ${new Date().toLocaleDateString('pt-BR')}`;
            
            // Análise inteligente simples
            const h = history.toLowerCase();
            const temCardio = h.includes('coração') || h.includes('peito') || h.includes('pressão') || h.includes('infarto');
            const temDiabetes = h.includes('diabetes') || h.includes('glicose') || h.includes('açúcar');
            
            let score = Math.min(parseInt(age) * 0.8 + (temCardio ? 20 : 0) + (temDiabetes ? 10 : 0), 98);
            score = Math.floor(score);
            
            const cor = score > 70 ? 'text-red-400' : score > 40 ? 'text-yellow-400' : 'text-emerald-400';
            const classe = score > 70 ? 'Alto Risco' : score > 40 ? 'Risco Moderado' : 'Baixo Risco';
            
            document.getElementById('rScore').innerHTML = `<span class="${cor}">${score}%</span>`;
            document.getElementById('rClass').innerHTML = `<span class="${cor}">${classe}</span>`;
            document.getElementById('rCond').textContent = temCardio ? 'Cardiovascular' : temDiabetes ? 'Metabólica' : 'Geral';
            
            // Desfechos
            const outcomes = [
                {nome: temCardio ? 'Evento Cardiovascular Agudo' : 'Internação Hospitalar', prob: Math.floor(score * 0.7), cor: 'red'},
                {nome: 'Estabilidade com Tratamento', prob: Math.floor(100 - score * 0.5), cor: 'emerald'},
                {nome: 'Melhora Significativa', prob: Math.floor(60 - score * 0.3), cor: 'blue'}
            ];
            
            document.getElementById('outcomesList').innerHTML = outcomes.map(o => `
                <div class="flex items-center gap-4">
                    <div class="flex-1">
                        <div class="flex justify-between mb-1">
                            <span class="text-slate-300 text-sm">${o.nome}</span>
                            <span class="text-${o.cor}-400 font-bold">${o.prob}%</span>
                        </div>
                        <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full bg-${o.cor}-500 rounded-full" style="width: ${o.prob}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Recomendações
            const recs = [
                {titulo: temCardio ? 'Cardiologia Urgente' : 'Acompanhamento Regular', 
                 desc: 'Consulta especializada em até ' + (score > 70 ? '24h' : '7 dias'),
                 icon: 'heart'},
                {titulo: 'Exames Laboratoriais', 
                 desc: 'Hemograma completo, função renal e hepática',
                 icon: 'test-tube'},
                {titulo: 'Modificação de Estilo de Vida', 
                 desc: 'Dieta mediterrânea + exercício 150min/semana',
                 icon: 'apple'},
                {titulo: 'Monitoramento Doméstico', 
                 desc: 'Aferição diária de pressão e registro de sintomas',
                 icon: 'activity'}
            ];
            
            document.getElementById('recsList').innerHTML = recs.map(r => `
                <div class="p-4 rounded-xl bg-slate-800/50 border border-slate-700 hover:border-cyan-500/50 transition-colors">
                    <div class="flex items-start gap-3">
                        <i data-lucide="${r.icon}" class="w-5 h-5 text-cyan-400 mt-0.5"></i>
                        <div>
                            <h4 class="text-white font-semibold mb-1">${r.titulo}</h4>
                            <p class="text-sm text-slate-400">${r.desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function novoCaso() {
            document.getElementById('results').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            document.getElementById('pName').value = '';
            document.getElementById('pAge').value = '';
            document.getElementById('pHistory').value = '';
            document.getElementById('progressBar').style.width = '0%';
        }
    </script>
</body>
</html>
